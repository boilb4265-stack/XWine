name: "Build XWine"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbox-series-s-uwp:
    name: "Windows SDK Xbox Series S MSIX (x64)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, Test, Pack and Sign Xbox Series S MSIX
        shell: pwsh
        run: |
          .\scripts\build_xbox_uwp.ps1 -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT" -Configuration Release

      - name: Upload Xbox Series S Dev Mode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XWine-XboxSeriesS-x64-DevMode
          path: |
            dist/xbox-uwp/XWine-XboxSeriesS-x64-DevMode.msix
            dist/xbox-uwp/XWine-DevMode-SelfSigned.cer
            dist/xbox-uwp/staging/Probes/xwine-phase7-probe.exe

  macos-arm64:
    name: "macOS Apple Silicon Build and Tests"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew Dependencies
        run: brew install cmake ninja sdl3 freetype libpng

      - name: Build and Run Tests
        run: |
          ./scripts/build_macos.sh
          ./scripts/run_tests.sh
          ./build/tools/diagnostics/xwine-diag sysinfo
          ./build/tools/graphics-bench/xwine-gfx-test
